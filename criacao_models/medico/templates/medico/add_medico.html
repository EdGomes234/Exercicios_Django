{% extends 'medico/base.html' %}
{% load static %}

{% block content %}

      <div class="container-add">
        		
          <form id="add_medico" class="form" action="/medico/add_medico" method="POST" role="form">
            
              {% csrf_token %}
              {{ form.as_p }}
              
              <div class="form-group">
                  <label class="form-label">Nome</label>
                  <input type="text" class="form-control" id="name" name="nome" placeholder="Nome" tabindex="1" required>
              </div>
              <div class="form-group">
                  <label class="form-label">Endereço</label>
                  <input type="text" class="form-control" id="relation" name="endereco" placeholder="Endereço" tabindex="2" required>
              </div>
              <div class="form-group">
                  <label class="form-label">Telefone</label>
                  <input type="text" class="form-control" id="phone" name="telefone" placeholder="Telefone" tabindex="3" required>
              </div>
              <div class="form-group">
                  <label class="form-label" for="email">Email</label>
                  <input type="text" class="form-control" id="email" name="email" placeholder="Email" tabindex="4" required>
              </div>
              <div class="form-group">
                  <label class="form-label" for="email">Data de Nascimento</label>
                  <input type="text" class="form-control" id="email" name="data_nascimento" placeholder=" Data de Nascimento" tabindex="4" required>
              </div>      
              <div class="form-group">
                  <label class="form-label" for="email">CRM</label>
                  <input type="text" class="form-control" id="email" name="crm" placeholder="CRM" tabindex="4" required>
              </div>      
              <div class="form-group">
                    
                    <h3>Especialidades</h3>
                    <select name="id_especialidade" id="id_especialidade">

                        {% for i in especialidades%}
                        <option value={{i.id}}>{{i.nome}}</option>
                        {% endfor%}

                    </select>
              </div>                                  

              </div>                                  
              
              <div class="text-center">
                  <button type="submit" class="btn">Confirmar</button>
              </div>

          </form>
          
      </div>
  </div>

{% endblock content %}
